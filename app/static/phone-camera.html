<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>手机摄像头推流</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/share-tech-mono@5/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/orbitron@5/index.min.css" />
  <style>
    :root {
      --bg: #060a0e;
      --panel: #0c1319;
      --card: #111920;
      --border: #1a2a38;
      --accent: #00ff88;
      --accent-dim: rgba(0,255,136,0.15);
      --accent-glow: rgba(0,255,136,0.35);
      --warn: #ff6b35;
      --text: #c8d8e4;
      --dim: #4a6070;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; overflow: hidden; user-select: none; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    video.front { transform: scaleX(-1); }
    .overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none;
      background: linear-gradient(180deg, rgba(6,10,14,0.8) 0%, transparent 18%, transparent 82%, rgba(6,10,14,0.9) 100%); }
    .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 16px 20px 48px;
      background: linear-gradient(180deg, rgba(6,10,14,0.95) 0%, transparent 100%);
      display: flex; align-items: center; justify-content: space-between; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: all 0.5s; }
    .live-dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent-glow); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .status-pill { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 2px; color: var(--dim); }
    .cam-label { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
    .preview-badge { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 25;
      background: rgba(12,19,25,0.85); border: 1px solid var(--accent); border-radius: 20px;
      padding: 6px 16px; font-size: 10px; letter-spacing: 2px; color: var(--accent); display: none; backdrop-filter: blur(8px); }
    .preview-badge.show { display: block; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding: 48px 20px 28px;
      background: linear-gradient(0deg, rgba(6,10,14,0.95) 0%, transparent 100%); display: flex; flex-direction: column; gap: 16px; }
    .info-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); letter-spacing: 1px; padding: 0 4px; }
    .tools-row { display: flex; justify-content: center; align-items: flex-end; gap: 24px; }
    .tool-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border);
      background: rgba(12,19,25,0.8); color: var(--text); font-size: 20px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(8px); }
    .tool-btn:active, .tool-btn.on { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    .capture-btn { width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .capture-btn:active { transform: scale(0.92); border-color: var(--accent); }
    .capture-btn-inner { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: all 0.2s; }
    .capture-btn:active .capture-btn-inner { background: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
    .flash { position: fixed; inset: 0; background: white; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
    .flash.on { opacity: 0.7; }
    .connect-screen { position: fixed; inset: 0; z-index: 50; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 32px; text-align: center; }
    .connect-screen.hide { display: none; }
    .connect-icon { font-size: 64px; opacity: 0.8; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .connect-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; }
    .connect-sub { font-size: 12px; color: var(--dim); line-height: 1.8; max-width: 300px; }
    .connect-btn { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
      font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 3px;
      padding: 14px 40px; border-radius: 6px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; margin-top: 8px; }
    .connect-btn:hover, .connect-btn:active { background: var(--accent); color: var(--bg); }
    .connect-status { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
    .error-screen { display: none; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 32px; }
    .error-screen.show { display: flex; }
    .error-icon { font-size: 48px; }
    .error-msg { font-size: 12px; color: var(--warn); line-height: 1.6; max-width: 280px; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.8);
      background: rgba(12,19,25,0.95); border: 1px solid var(--accent); border-radius: 8px;
      padding: 14px 28px; font-size: 13px; color: var(--accent); z-index: 100; opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; white-space: nowrap; backdrop-filter: blur(12px); }
    .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .perm-hint { font-size: 10px; color: var(--dim); letter-spacing: 1px; line-height: 1.6; max-width: 260px; }
    .conn-info { font-size: 11px; color: var(--dim); padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); margin-top: 8px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="connect-screen" id="connectScreen">
  <div class="connect-icon">📷</div>
  <div class="connect-title">连接摄像头</div>
  <div class="connect-sub">允许访问摄像头后，您的手机将作为实时监控摄像头向PC端传输画面。</div>
  <button class="connect-btn" id="startBtn">启用摄像头</button>
  <div class="conn-info" id="connInfo" style="display:none;"></div>
  <div class="connect-status" id="connectStatus"></div>
  <div class="error-screen" id="errorScreen">
    <div class="error-icon">⚠️</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <div class="perm-hint" id="permHint" style="display:none;">
    请在浏览器设置中允许摄像头权限后刷新重试
  </div>
</div>

<!-- 位置权限请求对话框 -->
<div class="connect-screen" id="locationScreen" style="display:none;">
  <div class="connect-icon">📍</div>
  <div class="connect-title">获取位置</div>
  <div class="connect-sub">是否允许获取当前位置信息，以便在地图上标记摄像头位置？</div>
  <div style="display:flex;gap:16px;margin-top:16px;">
    <button class="connect-btn" id="allowLocationBtn" style="background:var(--accent-dim);border-color:var(--accent);">允许</button>
    <button class="connect-btn" id="skipLocationBtn" style="background:rgba(255,255,255,0.05);border-color:var(--dim);">跳过</button>
  </div>
  <div class="conn-info" id="locationInfo" style="display:none;"></div>
  <div class="connect-status" id="locationStatus"></div>
</div>

<video id="bgVideo" autoplay playsinline muted></video>
<div class="overlay"></div>

<div class="top-bar">
  <div class="status-pill">
    <div class="live-dot" id="liveDot"></div>
    <span id="liveLabel">待机</span>
  </div>
  <div class="cam-label" id="camLabel">CAM-01</div>
  <div class="status-pill" style="opacity:0;"></div>
</div>

<div class="preview-badge" id="previewBadge">👁 <span id="viewerCount">0</span> 正在观看</div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
  <div class="info-row">
    <span id="resLabel">—</span>
    <span id="fpsLabel">— fps</span>
    <span id="encodeLabel">— ms/帧</span>
  </div>
  <div class="tools-row">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <button class="tool-btn" id="flipBtn" title="切换摄像头">🔄</button>
      <span style="font-size:9px;color:var(--dim);">翻转</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <button class="tool-btn" id="torchBtn" title="闪光灯">💡</button>
      <span style="font-size:9px;color:var(--dim);">闪光灯</span>
    </div>
    <button class="capture-btn" id="captureBtn">
      <div class="capture-btn-inner"></div>
    </button>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <button class="tool-btn" id="muteBtn" title="静音">🔇</button>
      <span style="font-size:9px;color:var(--dim);">静音</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <button class="tool-btn" id="discBtn" title="断开">✕</button>
      <span style="font-size:9px;color:var(--dim);">断开</span>
    </div>
  </div>
</div>

<div class="flash" id="flashEl"></div>
<div class="toast" id="toast"></div>

<script>
// ── 全局状态 ──
const video   = document.getElementById('bgVideo');
let stream    = null;
let ws        = null;
let currentFacing = 'environment';
let torchOn       = false;
let encodeTimer   = null;
let encodeMs      = 0;
let encodeCount   = 0;
let encodeTotalMs = 0;
let connected     = false;
let reconnectTimer = null;
let uid           = Math.random().toString(36).substr(2, 9);

// 隐藏项
document.getElementById('startBtn').addEventListener('click', startCamera);
document.getElementById('allowLocationBtn').addEventListener('click', requestLocation);
document.getElementById('skipLocationBtn').addEventListener('click', skipLocation);
document.getElementById('flipBtn').addEventListener('click', flipCamera);
document.getElementById('torchBtn').addEventListener('click', toggleTorch);
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.getElementById('captureBtn').addEventListener('click', capturePhoto);
document.getElementById('discBtn').addEventListener('click', () => location.reload());

// ── 启动摄像头 ──
async function startCamera(facing) {
  facing = facing || 'environment';
  document.getElementById('connectStatus').textContent = '正在启动摄像头...';
  document.getElementById('connInfo').style.display = 'none';
  document.getElementById('errorScreen').classList.remove('show');

  // 检查浏览器兼容性
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    // 兼容性处理
    navigator.mediaDevices = navigator.mediaDevices || {
      getUserMedia: function(constraints) {
        const getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
        if (!getUserMedia) {
          return Promise.reject(new Error('浏览器不支持摄像头访问'));
        }
        return new Promise(function(resolve, reject) {
          getUserMedia.call(navigator, constraints, resolve, reject);
        });
      }
    };
  }

  // 清理旧流
  if (stream) {
    stream.getTracks().forEach(t => {
      t.stop();
      console.log('停止旧轨道:', t.label);
    });
    stream = null;
  }

  // 关闭旧连接
  if (ws) {
    ws.onclose = null;
    ws.close();
    ws = null;
    console.log('关闭旧WebSocket连接');
  }

  // 等待一下让资源完全释放
  await new Promise(resolve => setTimeout(resolve, 300));

  // 尝试获取摄像头（简化约束，减少等待时间）
  const constraints = [
    { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: { facingMode: facing } },
    { video: true }
  ];

  let errMsg = '无法访问摄像头';

  for (let i = 0; i < constraints.length; i++) {
    try {
      console.log('尝试获取摄像头流，约束:', constraints[i]);
      stream = await navigator.mediaDevices.getUserMedia(constraints[i]);
      console.log('成功获取摄像头流');
      break;
    } catch (e) {
      console.error('获取摄像头流失败:', e);
      errMsg = e.message;
      if (i === constraints.length - 1) throw e;
    }
  }

  video.srcObject = stream;
  video.classList.toggle('front', facing === 'user');

  await new Promise(resolve => {
    video.onloadedmetadata = resolve;
    setTimeout(resolve, 2000); // 2秒超时
  });
  await video.play().catch(() => {});

  currentFacing = facing;
  const track    = stream.getVideoTracks()[0];
  const settings = track.getSettings();
  document.getElementById('resLabel').textContent = `${settings.width || video.videoWidth || '?'}×${settings.height || video.videoHeight || '?'}`;

  // 闪光灯支持检测 - 保持按钮可用，让toggleTorch函数处理各种情况
  console.log('检测闪光灯支持...');
  if (track.getCapabilities) {
    const capabilities = track.getCapabilities();
    console.log('摄像头能力:', capabilities);
    if (capabilities.torch) {
      console.log('当前摄像头支持闪光灯');
    } else {
      console.log('当前摄像头可能不支持闪光灯，但保持按钮可用');
    }
  } else {
    console.log('浏览器不支持getCapabilities方法，但保持按钮可用');
  }
  // 始终保持按钮可用
  document.getElementById('torchBtn').style.opacity = '1';
  document.getElementById('torchBtn').style.pointerEvents = 'auto';

  // 先隐藏摄像头连接界面，显示位置请求界面
  document.getElementById('connectScreen').classList.add('hide');
  document.getElementById('locationScreen').style.display = 'flex';
}

// ── 请求位置权限 ──
function requestLocation() {
  document.getElementById('locationStatus').textContent = '正在获取位置...';
  document.getElementById('locationInfo').style.display = 'none';

  if (!navigator.geolocation) {
    showToast('浏览器不支持位置服务');
    proceedToCamera();
    return;
  }

  const options = {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  };

  function success(position) {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const acc = position.coords.accuracy;

    console.log('位置获取成功:', { lat, lng, acc });
    document.getElementById('locationInfo').style.display = 'block';
    document.getElementById('locationInfo').textContent = `位置: ${lat.toFixed(6)}, ${lng.toFixed(6)}\n精度: ${Math.round(acc)}米`;
    
    // 存储位置信息
    window.phoneLocation = { latitude: lat, longitude: lng, accuracy: acc };
    
    showToast('位置获取成功');
    setTimeout(proceedToCamera, 1000);
  }

  function error(err) {
    console.warn('位置获取失败:', err);
    let msg = '无法获取位置';
    if (err.code === 1) msg = '位置权限被拒绝';
    if (err.code === 2) msg = '无法获取位置信息';
    if (err.code === 3) msg = '获取位置超时';
    
    showToast(msg, 2000);
    setTimeout(proceedToCamera, 1500);
  }

  navigator.geolocation.getCurrentPosition(success, error, options);
}

// ── 跳过位置获取 ──
function skipLocation() {
  showToast('跳过位置获取');
  setTimeout(proceedToCamera, 500);
}

// ── 继续启动摄像头界面 ──
function proceedToCamera() {
  document.getElementById('locationScreen').style.display = 'none';
  document.getElementById('bottomBar').style.display = 'flex';

  // 连接 WebSocket
  connectServer();

  // 开始推流
  startStreaming();
}

// ── WebSocket 连接服务器 ──
function connectServer() {
  if (ws) {
    ws.onclose = null;
    ws.close();
  }

  document.getElementById('connInfo').style.display = 'block';
  document.getElementById('connInfo').textContent = '正在连接服务器...';
  document.getElementById('connectStatus').textContent = '请等待连接...';

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const host  = location.host;
  const wsUrl = `${proto}://${host}/api/v1/camera_infos/phone_camera/phone`;
  
  console.log('连接到:', wsUrl);
  
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    connected = true;
    document.getElementById('liveDot').classList.add('on');
    document.getElementById('liveLabel').textContent = '直播中';
    document.getElementById('connInfo').textContent = '已连接！推流中...';
    document.getElementById('connectStatus').textContent = '连接成功';
    showToast('已连接到监控端', 1500);

    // 发送元数据
    const track = stream ? stream.getVideoTracks()[0] : null;
    const settings = track ? track.getSettings() : {};
    const metaData = {
      type: 'meta',
      data: {
        uid: uid,
        facing: currentFacing,
        ip: location.hostname,
        width: settings.width || video.videoWidth || 0,
        height: settings.height || video.videoHeight || 0
      }
    };

    // 添加位置信息（如果有）
    if (window.phoneLocation) {
      metaData.data.location = window.phoneLocation;
    }

    send(JSON.stringify(metaData));

    // 每10秒保活
    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) send('');
    }, 10000);
  };

  ws.onclose = () => {
    connected = false;
    document.getElementById('liveDot').classList.remove('on');
    document.getElementById('liveLabel').textContent = '断开';
    document.getElementById('previewBadge').classList.remove('show');

    if (stream) {
      showToast('连接断开，重连中...', 2000);
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectServer, 3000);
    }
  };

  ws.onerror = () => {};
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
}

// ── 高效帧推流 ──
function startStreaming() {
  // 只在可视时推流（节省性能）
  const FRAME_INTERVAL = 120; // ~8fps，低延迟够用
  const capCanvas = document.createElement('canvas');
  const capCtx    = capCanvas.getContext('2d', { alpha: false });

  // FPS 统计
  let fpsFrames = 0;
  let fpsLastTime = Date.now();
  setInterval(() => {
    const elapsed = (Date.now() - fpsLastTime) / 1000;
    document.getElementById('fpsLabel').textContent = `${Math.round(fpsFrames / elapsed)} fps`;
    fpsFrames = 0;
    fpsLastTime = Date.now();
    document.getElementById('encodeLabel').textContent =
      encodeCount > 0 ? `${Math.round(encodeTotalMs / encodeCount)} ms/帧` : '— ms/帧';
    encodeCount = 0;
    encodeTotalMs = 0;
  }, 3000);

  function captureFrame() {
    if (!connected || !stream) {
      encodeTimer = setTimeout(captureFrame, FRAME_INTERVAL);
      return;
    }

    const t0 = Date.now();
    const vw = video.videoWidth  || video.offsetWidth;
    const vh = video.videoHeight || video.offsetHeight;

    if (vw < 10 || vh < 10) {
      encodeTimer = setTimeout(captureFrame, FRAME_INTERVAL);
      return;
    }

    capCanvas.width  = Math.min(vw, 1280); // 限制最大宽度，省流量
    capCanvas.height = Math.round(capCanvas.width * (vh / vw));

    try {
      capCtx.save();
      // 前置摄像头镜像
      if (currentFacing === 'user') {
        capCtx.translate(capCanvas.width, 0);
        capCtx.scale(-1, 1);
      }
      capCtx.drawImage(video, 0, 0, capCanvas.width, capCanvas.height);
      capCtx.restore();

      capCanvas.toBlob(blob => {
        encodeMs = Date.now() - t0;
        encodeTotalMs += encodeMs;
        encodeCount++;

        if (blob && ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(blob); } catch (e) {}
        }
        fpsFrames++;
      }, 'image/jpeg', 0.6); // 0.6 质量，文件更小

    } catch (e) {
      // 绘制失败，跳过
    }

    encodeTimer = setTimeout(captureFrame, FRAME_INTERVAL);
  }

  // 等待视频元数据加载后再开始
  if (video.readyState >= 2) {
    captureFrame();
  } else {
    video.onloadedmetadata = () => captureFrame();
  }
}

// ── 翻转摄像头 ──
function flipCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (encodeTimer) clearTimeout(encodeTimer);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  connected = false;
  const next = currentFacing === 'environment' ? 'user' : 'environment';
  showToast(next === 'user' ? '切换到前置' : '切换到后置');
  startCamera(next);
}

// ── 闪光灯 ──
function toggleTorch() {
  console.log('toggleTorch被调用');
  if (!stream) {
    showToast('摄像头未初始化');
    return;
  }
  
  const tracks = stream.getVideoTracks();
  if (!tracks || tracks.length === 0) {
    showToast('无法获取摄像头轨道');
    return;
  }
  
  const track = tracks[0];
  if (!track) {
    showToast('无法获取摄像头轨道');
    return;
  }
  
  console.log('VideoTrack:', track);
  
  // 首先尝试检测闪光灯支持
  if (track.getCapabilities) {
    const capabilities = track.getCapabilities();
    console.log('摄像头能力:', capabilities);
    
    // 直接尝试各种方法，不依赖capabilities.torch
    torchOn = !torchOn;
    
    // 方法1: 直接使用applyConstraints，不带advanced
    console.log('尝试方法1: 直接使用applyConstraints');
    track.applyConstraints({ torch: torchOn })
      .then(() => {
        console.log('方法1成功');
        document.getElementById('torchBtn').classList.toggle('on', torchOn);
        showToast(torchOn ? '闪光灯开启' : '闪光灯关闭');
      })
      .catch((error) => {
        console.error('方法1失败:', error);
        
        // 方法2: 使用advanced数组
        console.log('尝试方法2: 使用advanced数组');
        return track.applyConstraints({ advanced: [{ torch: torchOn }] });
      })
      .then(() => {
        console.log('方法2成功');
        document.getElementById('torchBtn').classList.toggle('on', torchOn);
        showToast(torchOn ? '闪光灯开启' : '闪光灯关闭');
      })
      .catch((error) => {
        console.error('方法2失败:', error);
        
        // 方法3: 尝试直接设置torch属性
        console.log('尝试方法3: 直接设置torch属性');
        if ('torch' in track) {
          try {
            track.torch = torchOn;
            console.log('方法3成功');
            document.getElementById('torchBtn').classList.toggle('on', torchOn);
            showToast(torchOn ? '闪光灯开启' : '闪光灯关闭');
          } catch (err) {
            console.error('方法3失败:', err);
            torchOn = !torchOn; // 恢复原来的状态
            showToast('无法控制闪光灯: 设备或浏览器不支持');
          }
        } else {
          console.error('track对象没有torch属性');
          torchOn = !torchOn; // 恢复原来的状态
          showToast('无法控制闪光灯: 设备或浏览器不支持');
        }
      });
  } else {
    console.log('浏览器不支持getCapabilities');
    showToast('浏览器不支持闪光灯控制');
  }
}

// ── 静音 ──
let muted = true;
function toggleMute() {
  muted = !muted;
  if (stream) stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
  const btn = document.getElementById('muteBtn');
  btn.textContent = muted ? '🔇' : '🔊';
  btn.classList.toggle('on', !muted);
  showToast(muted ? '已静音' : '已开启声音');
}

// ── 拍照 ──
function capturePhoto() {
  const flash = document.getElementById('flashEl');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 150);

  const capCanvas = document.createElement('canvas');
  capCanvas.width  = video.videoWidth  || video.offsetWidth;
  capCanvas.height = video.videoHeight || video.offsetHeight;
  const c = capCanvas.getContext('2d');
  if (currentFacing === 'user') {
    c.translate(capCanvas.width, 0);
    c.scale(-1, 1);
  }
  c.drawImage(video, 0, 0);

  capCanvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `capture_${Date.now()}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('照片已保存');
  }, 'image/jpeg', 0.95);
}

// ── Toast ──
function showToast(msg, duration) {
  duration = duration || 2000;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── 页面卸载时清理 ──
window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ws) ws.close();
});
</script>
