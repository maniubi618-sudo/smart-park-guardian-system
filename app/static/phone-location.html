<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>获取位置</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/share-tech-mono@5/index.min.css" />
  <style>
    :root {
      --bg: #060a0e;
      --panel: #0c1319;
      --accent: #00ff88;
      --accent-dim: rgba(0,255,136,0.15);
      --warn: #ff6b35;
      --text: #c8d8e4;
      --dim: #4a6070;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; overflow: hidden; }
    .container { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .icon { font-size: 80px; margin-bottom: 24px; }
    .title { font-size: 24px; margin-bottom: 16px; color: var(--accent); }
    .subtitle { font-size: 14px; color: var(--dim); text-align: center; margin-bottom: 32px; line-height: 1.6; }
    .location-info { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 320px; margin-bottom: 24px; display: none; }
    .location-info.show { display: block; }
    .location-info .label { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .location-info .value { font-size: 16px; color: var(--accent); word-break: break-all; }
    .location-info .accuracy { font-size: 11px; color: var(--dim); margin-top: 8px; }
    .btn { padding: 14px 32px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent); font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; margin: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn.secondary { border-color: var(--dim); background: transparent; color: var(--dim); }
    .status { font-size: 12px; color: var(--dim); margin-top: 16px; }
    .status.error { color: var(--warn); }
    .status.success { color: var(--accent); }
    .buttons { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon">📍</div>
    <div class="title">获取位置</div>
    <div class="subtitle">点击下方按钮获取当前位置<br/>位置信息将发送给电脑端</div>
    
    <div class="location-info" id="locationInfo">
      <div class="label">当前位置</div>
      <div class="value" id="locationValue">—</div>
      <div class="accuracy" id="locationAccuracy"></div>
    </div>
    
    <div class="buttons">
      <button class="btn" id="getLocationBtn">获取位置</button>
      <button class="btn secondary" id="sendLocationBtn" style="display:none;">发送位置到电脑</button>
      <button class="btn secondary" id="closeBtn">关闭</button>
    </div>
    
    <div class="status" id="status"></div>
  </div>

  <script>
    let currentLocation = null;
    
    const statusEl = document.getElementById('status');
    const locationInfoEl = document.getElementById('locationInfo');
    const locationValueEl = document.getElementById('locationValue');
    const locationAccuracyEl = document.getElementById('locationAccuracy');
    const getLocationBtn = document.getElementById('getLocationBtn');
    const sendLocationBtn = document.getElementById('sendLocationBtn');
    const closeBtn = document.getElementById('closeBtn');
    
    function showStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }
    
    function getLocation() {
      if (!navigator.geolocation) {
        showStatus('浏览器不支持位置服务', 'error');
        return;
      }
      
      showStatus('正在获取位置...');
      getLocationBtn.textContent = '获取中...';
      getLocationBtn.disabled = true;
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const acc = position.coords.accuracy;
          
          currentLocation = { latitude: lat, longitude: lng, accuracy: acc };
          
          locationValueEl.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          locationAccuracyEl.textContent = `精度: ${Math.round(acc)}米`;
          locationInfoEl.classList.add('show');
          sendLocationBtn.style.display = 'block';
          getLocationBtn.style.display = 'none';
          
          showStatus('位置获取成功', 'success');
          getLocationBtn.textContent = '获取位置';
          getLocationBtn.disabled = false;
        },
        (err) => {
          let msg = '获取位置失败';
          if (err.code === 1) msg = '位置权限被拒绝';
          if (err.code === 2) msg = '无法获取位置信息';
          if (err.code === 3) msg = '获取位置超时';
          
          showStatus(msg, 'error');
          getLocationBtn.textContent = '重新获取';
          getLocationBtn.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
    
    function sendLocation() {
      if (!currentLocation) {
        showStatus('请先获取位置', 'error');
        return;
      }
      
      if (window.opener) {
        window.opener.postMessage({
          type: 'location',
          data: currentLocation
        }, '*');
        showStatus('位置已发送', 'success');
        setTimeout(() => window.close(), 1000);
      } else {
        showStatus('无法发送位置', 'error');
      }
    }
    
    getLocationBtn.addEventListener('click', getLocation);
    sendLocationBtn.addEventListener('click', sendLocation);
    closeBtn.addEventListener('click', () => window.close());
    
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'requestLocation') {
        getLocation();
      }
    });
  </script>
</body>
</html>
